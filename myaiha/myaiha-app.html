<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>MyAIha</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --navy-950:#081524;
    --navy-900:#0f2a43;
    --navy-800:#173a5c;
    --navy-700:#204a72;
    --teal-500:#1fb8a6;
    --teal-600:#159183;
    --teal-100:#e3f7f4;
    --paper:#f6f9fb;
    --card:#ffffff;
    --ink-900:#0d1621;
    --ink-600:#54626f;
    --ink-400:#8494a3;
    --line:#e2e8ee;
    --amber:#e2a23b;
    --radius-sm:10px;
    --radius-md:14px;
    --radius-lg:18px;
    box-sizing:border-box;
    padding-top:env(safe-area-inset-top,0px);
    padding-bottom:env(safe-area-inset-bottom,0px);
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --paper:#0b1420; --card:#101c2b; --line:#1e2c3d;
      --ink-900:#eef3f8; --ink-600:#a7b4c1; --ink-400:#79879a;
      --teal-100:#0f2c29;
    }
  }
  *,*::before,*::after{box-sizing:inherit;margin:0;padding:0;}
  html,body{height:100%;}
  body{
    font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
    background:var(--paper);color:var(--ink-900);-webkit-font-smoothing:antialiased;
  }
  button,textarea,input{font-family:inherit;}

  .app{
    display:grid;grid-template-columns:272px 1fr;
    height:100vh;height:100dvh;
  }

  /* ---------- Sidebar ---------- */
  .sidebar{
    background:var(--navy-950);color:#cfe0e8;
    display:flex;flex-direction:column;min-height:0;
    padding-top:env(safe-area-inset-top,0px);
  }
  .sb-head{padding:18px 16px 12px;}
  .sb-logo{display:flex;align-items:center;gap:9px;font-weight:800;font-size:15px;color:#fff;margin-bottom:16px;}
  .sb-logo .dot{width:9px;height:9px;border-radius:50%;background:var(--teal-500);}
  .new-btn{
    width:100%;display:flex;align-items:center;gap:8px;background:rgba(255,255,255,.06);
    border:1px solid rgba(255,255,255,.12);color:#eaf1f7;border-radius:var(--radius-sm);
    padding:10px 12px;font-size:13px;font-weight:600;cursor:pointer;
  }
  .new-btn:hover{background:rgba(255,255,255,.1);}
  .quick-actions{padding:6px 12px 10px;display:flex;flex-direction:column;gap:2px;}
  .qa-item{
    display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:var(--radius-sm);
    font-size:12.5px;font-weight:600;color:#b7c8d3;cursor:pointer;
  }
  .qa-item:hover{background:rgba(255,255,255,.06);color:#fff;}
  .sb-divider{height:1px;background:rgba(255,255,255,.08);margin:6px 16px;}
  .sb-section-label{padding:14px 16px 6px;font-size:11px;font-weight:700;color:#6f8290;text-transform:uppercase;letter-spacing:.04em;}
  .conv-scroll{flex:1;overflow-y:auto;padding:0 10px;}
  .sb-conv{
    display:flex;flex-direction:column;gap:2px;padding:9px 10px;border-radius:var(--radius-sm);
    cursor:pointer;margin-bottom:2px;
  }
  .sb-conv:hover{background:rgba(255,255,255,.06);}
  .sb-conv.active{background:rgba(31,184,166,.14);}
  .sb-conv .t{font-size:12.5px;font-weight:600;color:#eaf1f7;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .sb-conv .s{font-size:11px;color:#7c8fa0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .sb-foot{
    padding:12px 16px;border-top:1px solid rgba(255,255,255,.08);
    display:flex;align-items:center;gap:10px;
  }
  .sb-avatar{width:30px;height:30px;border-radius:50%;background:linear-gradient(135deg,var(--teal-500),var(--navy-700));flex:0 0 auto;}
  .sb-foot .who{flex:1;min-width:0;}
  .sb-foot .who b{display:block;font-size:12.5px;color:#eaf1f7;}
  .sb-foot .who span{font-size:11px;color:#7c8fa0;}
  .sb-icon-btn{width:28px;height:28px;border-radius:8px;display:flex;align-items:center;justify-content:center;color:#9fb2bf;cursor:pointer;}
  .sb-icon-btn:hover{background:rgba(255,255,255,.08);color:#fff;}

  /* ---------- Main ---------- */
  .main{display:flex;flex-direction:column;min-width:0;min-height:0;background:var(--paper);}
  .main-head{
    display:flex;align-items:center;justify-content:space-between;gap:12px;
    padding:14px 22px;border-bottom:1px solid var(--line);background:var(--card);
  }
  .mh-who{display:flex;align-items:center;gap:12px;}
  .mh-avatar{width:36px;height:36px;border-radius:50%;background:linear-gradient(135deg,var(--teal-500),var(--navy-700));}
  .mh-title{font-size:14.5px;font-weight:700;}
  .mh-sub{font-size:12px;color:var(--ink-600);display:flex;align-items:center;gap:6px;}
  .channel-tag{background:var(--teal-100);color:var(--teal-600);font-size:10.5px;font-weight:700;padding:2px 8px;border-radius:999px;}
  .mh-actions{display:flex;gap:8px;}
  .icon-btn{
    width:34px;height:34px;border-radius:10px;border:1px solid var(--line);background:var(--card);
    display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--ink-600);
  }
  .icon-btn:hover{background:var(--paper);}

  .triage-banner{
    margin:14px 22px 0;padding:10px 14px;border-radius:var(--radius-md);
    display:flex;align-items:center;gap:10px;font-size:12.5px;font-weight:600;
    background:var(--teal-100);color:var(--teal-600);
  }
  .triage-banner.urgent{background:#fbe9d7;color:#a5650f;}
  .triage-dot{width:7px;height:7px;border-radius:50%;background:currentColor;flex:0 0 auto;}

  .messages{flex:1;overflow-y:auto;padding:20px 22px;display:flex;flex-direction:column;gap:16px;}
  .day-sep{align-self:center;font-size:11px;color:var(--ink-400);background:var(--card);border:1px solid var(--line);padding:3px 12px;border-radius:999px;}
  .msg-row{display:flex;gap:10px;max-width:70%;}
  .msg-row.out{align-self:flex-end;flex-direction:row-reverse;}
  .msg-avatar{width:28px;height:28px;border-radius:50%;flex:0 0 auto;}
  .msg-avatar.ai{background:linear-gradient(135deg,var(--teal-500),var(--navy-700));}
  .msg-avatar.human{background:var(--navy-800);}
  .msg-avatar.patient{background:linear-gradient(135deg,#8494a3,#54626f);}
  .msg-col{min-width:0;}
  .msg-sender{font-size:11px;font-weight:700;color:var(--ink-400);margin-bottom:3px;}
  .msg-row.out .msg-sender{text-align:right;}
  .bubble{padding:10px 14px;border-radius:var(--radius-md);font-size:13.5px;line-height:1.5;}
  .msg-row.in .bubble{background:var(--card);border:1px solid var(--line);border-bottom-left-radius:4px;}
  .msg-row.out .bubble{background:var(--navy-900);color:#fff;border-bottom-right-radius:4px;}
  .msg-meta{font-size:10.5px;color:var(--ink-400);margin-top:4px;}
  .msg-row.out .msg-meta{text-align:right;}
  .typing{display:flex;gap:4px;padding:4px 2px;}
  .typing span{width:6px;height:6px;border-radius:50%;background:var(--ink-400);animation:bounce 1.2s infinite ease-in-out;}
  .typing span:nth-child(2){animation-delay:.15s;}
  .typing span:nth-child(3){animation-delay:.3s;}
  @keyframes bounce{0%,60%,100%{transform:translateY(0);opacity:.5;}30%{transform:translateY(-4px);opacity:1;}}

  .quick-chips{display:flex;gap:8px;padding:0 22px 10px;flex-wrap:wrap;}
  .qchip{
    font-size:12px;font-weight:600;padding:7px 14px;border-radius:999px;
    border:1px solid var(--line);background:var(--card);color:var(--ink-600);cursor:pointer;
  }
  .qchip:hover{background:var(--teal-100);color:var(--teal-600);border-color:var(--teal-100);}

  .composer{
    border-top:1px solid var(--line);background:var(--card);padding:12px 22px;
    display:flex;align-items:flex-end;gap:10px;
    padding-bottom:calc(12px + env(safe-area-inset-bottom,0px));
  }
  .composer-tools{display:flex;gap:6px;}
  .composer-input{
    flex:1;background:var(--paper);border:1px solid var(--line);border-radius:var(--radius-md);
    padding:10px 14px;font-size:13.5px;resize:none;outline:none;color:var(--ink-900);max-height:120px;
  }
  .composer-input::placeholder{color:var(--ink-400);}
  .send-btn{
    background:var(--teal-500);color:#03211d;border:none;border-radius:var(--radius-md);
    padding:10px 18px;font-weight:700;font-size:13.5px;cursor:pointer;flex:0 0 auto;
  }
  .send-btn:hover{background:var(--teal-600);color:#fff;}

  /* ---------- Mobile ---------- */
  .sb-toggle{display:none;}
  @media (max-width:820px){
    .app{grid-template-columns:1fr;}
    .sidebar{
      position:fixed;inset:0 auto 0 0;width:272px;z-index:30;
      transform:translateX(-100%);transition:transform .2s ease;
    }
    .app.sb-open .sidebar{transform:translateX(0);}
    .sb-toggle{
      display:flex;width:34px;height:34px;border-radius:10px;border:1px solid var(--line);
      background:var(--card);align-items:center;justify-content:center;cursor:pointer;
    }
    .sb-scrim{display:none;position:fixed;inset:0;background:rgba(3,10,18,.4);z-index:25;}
    .app.sb-open .sb-scrim{display:block;}
    .msg-row{max-width:86%;}
  }
</style>
</head>
<body>

<div class="app" id="app">
  <div class="sb-scrim" id="scrim"></div>

  <aside class="sidebar" id="sidebar">
    <div class="sb-head">
      <div class="sb-logo">MyAIha<span class="dot"></span></div>
      <button class="new-btn" id="newConvBtn">＋ New conversation</button>
    </div>
    <div class="quick-actions">
      <div class="qa-item">🩺 Symptom checker</div>
      <div class="qa-item">📅 Book a specialist</div>
      <div class="qa-item">💊 Prescription refill</div>
      <div class="qa-item">📁 Health records</div>
    </div>
    <div class="sb-divider"></div>
    <div class="sb-section-label">Conversations</div>
    <div class="conv-scroll" id="convList"></div>
    <div class="sb-foot">
      <div class="sb-avatar"></div>
      <div class="who"><b>Chidinma U.</b><span>Patient · Lagos</span></div>
      <div class="sb-icon-btn">⚙️</div>
    </div>
  </aside>

  <main class="main">
    <div class="main-head">
      <div class="mh-who">
        <div class="sb-toggle" id="sbToggle">☰</div>
        <div class="mh-avatar" id="mhAvatar"></div>
        <div>
          <div class="mh-title" id="mhTitle">Fever &amp; headache</div>
          <div class="mh-sub"><span class="channel-tag" id="mhChannel">WhatsApp</span><span id="mhSub">Active now</span></div>
        </div>
      </div>
      <div class="mh-actions">
        <div class="icon-btn" title="Call">📞</div>
        <div class="icon-btn" title="Patient record">📁</div>
        <div class="icon-btn" title="More">⋯</div>
      </div>
    </div>

    <div class="triage-banner urgent" id="triageBanner">
      <span class="triage-dot"></span>
      <span id="triageText">Flagged urgent — routed to Dr. Okafor, General Practice</span>
    </div>

    <div class="messages" id="messages"></div>

    <div class="quick-chips" id="quickChips">
      <div class="qchip" data-q="Can I get this delivered?">Can I get this delivered?</div>
      <div class="qchip" data-q="Book a follow-up">Book a follow-up</div>
      <div class="qchip" data-q="Talk to a pharmacist">Talk to a pharmacist</div>
    </div>

    <div class="composer">
      <div class="composer-tools">
        <div class="icon-btn" title="Attach">📎</div>
        <div class="icon-btn" title="Voice">🎤</div>
      </div>
      <textarea class="composer-input" id="composerInput" rows="1" placeholder="Message MyAIha..."></textarea>
      <button class="send-btn" id="sendBtn">Send</button>
    </div>
  </main>
</div>

<script>
const conversations = [
  {
    id:1, title:"Fever & headache", sub:"Active now", channel:"WhatsApp", avatarClass:"human",
    triage:{urgent:true, text:"Flagged urgent — routed to Dr. Okafor, General Practice"},
    messages:[
      {from:"in", sender:"MyAIha", cls:"ai", text:"Hi Chidinma, tell me what's going on and I'll help right away."},
      {from:"out", sender:"You", text:"I've had a fever since last night, around 38.9°C, with chills and a headache."},
      {from:"in", sender:"MyAIha", cls:"ai", text:"Thanks for the details. Given the fever and chills, I'm connecting you with a doctor now."},
      {from:"in", sender:"Dr. Okafor", cls:"human", text:"Hi Chidinma, I've reviewed what you shared. Have you taken anything for the fever yet?"}
    ]
  },
  {
    id:2, title:"Prescription refill", sub:"2h ago", channel:"App", avatarClass:"ai",
    triage:{urgent:false, text:"Routine request — handled by MyAIha"},
    messages:[
      {from:"out", sender:"You", text:"Can I refill my blood pressure medication?"},
      {from:"in", sender:"MyAIha", cls:"ai", text:"Sure — I see Lisinopril 10mg on your record. I've sent the refill to Damorex Pharmacy for pickup."}
    ]
  },
  {
    id:3, title:"Appointment booking", sub:"Yesterday", channel:"SMS", avatarClass:"human",
    triage:{urgent:false, text:"Confirmed — appointment scheduled"},
    messages:[
      {from:"out", sender:"You", text:"I'd like to see a dermatologist next week."},
      {from:"in", sender:"MyAIha", cls:"ai", text:"I found an opening with Dr. Bello on Tuesday at 10am. Shall I book it?"},
      {from:"out", sender:"You", text:"Yes please."},
      {from:"in", sender:"MyAIha", cls:"ai", text:"Booked. You'll get a reminder 1 hour before your visit."}
    ]
  },
  {
    id:4, title:"Lab result question", sub:"3 days ago", channel:"Web", avatarClass:"human",
    triage:{urgent:false, text:"Reviewed by Dr. Chinedu Okonkwo"},
    messages:[
      {from:"out", sender:"You", text:"My lab results came in — what does 'elevated WBC' mean?"},
      {from:"in", sender:"MyAIha", cls:"ai", text:"That can indicate your body is fighting an infection. I've shared this with Dr. Okonkwo for review."},
      {from:"in", sender:"Dr. Chinedu Okonkwo", cls:"human", text:"It's mild and consistent with the infection we treated last week — nothing to worry about."}
    ]
  }
];

let activeId = 1;

function renderList(){
  const el = document.getElementById("convList");
  el.innerHTML = "";
  conversations.forEach(c => {
    const item = document.createElement("div");
    item.className = "sb-conv" + (c.id===activeId ? " active" : "");
    item.innerHTML = `<div class="t">${c.title}</div><div class="s">${c.channel} · ${c.sub}</div>`;
    item.addEventListener("click", () => selectConversation(c.id));
    el.appendChild(item);
  });
}

function renderThread(){
  const c = conversations.find(x => x.id===activeId);
  document.getElementById("mhTitle").textContent = c.title;
  document.getElementById("mhChannel").textContent = c.channel;
  document.getElementById("mhSub").textContent = c.sub;
  document.getElementById("mhAvatar").style.background = c.avatarClass==="ai"
    ? "linear-gradient(135deg,var(--teal-500),var(--navy-700))" : "var(--navy-800)";

  const banner = document.getElementById("triageBanner");
  banner.classList.toggle("urgent", c.triage.urgent);
  document.getElementById("triageText").textContent = c.triage.text;

  const msgEl = document.getElementById("messages");
  msgEl.innerHTML = '<div class="day-sep">Today</div>';
  c.messages.forEach(m => msgEl.appendChild(buildMsgRow(m)));
  msgEl.scrollTop = msgEl.scrollHeight;
}

function buildMsgRow(m){
  const row = document.createElement("div");
  row.className = "msg-row " + m.from;
  const avClass = m.from==="out" ? "patient" : (m.cls || "human");
  row.innerHTML = `
    <div class="msg-avatar ${avClass}"></div>
    <div class="msg-col">
      <div class="msg-sender">${m.sender}</div>
      <div class="bubble">${m.text}</div>
      <div class="msg-meta">${m.time || "Now"}</div>
    </div>
  `;
  return row;
}

function selectConversation(id){
  activeId = id;
  renderList();
  renderThread();
  document.getElementById("app").classList.remove("sb-open");
}

document.getElementById("sbToggle").addEventListener("click", () => {
  document.getElementById("app").classList.toggle("sb-open");
});
document.getElementById("scrim").addEventListener("click", () => {
  document.getElementById("app").classList.remove("sb-open");
});

document.getElementById("newConvBtn").addEventListener("click", () => {
  const id = Math.max(...conversations.map(c=>c.id)) + 1;
  conversations.unshift({
    id, title:"New conversation", sub:"Just now", channel:"App", avatarClass:"ai",
    triage:{urgent:false, text:"MyAIha is ready to help"},
    messages:[{from:"in", sender:"MyAIha", cls:"ai", text:"Hi! What can I help you with today?"}]
  });
  selectConversation(id);
});

function sendMessage(text){
  text = (text || document.getElementById("composerInput").value).trim();
  if(!text) return;
  const c = conversations.find(x => x.id===activeId);
  const msgEl = document.getElementById("messages");
  c.messages.push({from:"out", sender:"You", text, time:"Now"});
  msgEl.appendChild(buildMsgRow({from:"out", sender:"You", text, time:"Now"}));
  document.getElementById("composerInput").value = "";
  msgEl.scrollTop = msgEl.scrollHeight;

  const typingRow = document.createElement("div");
  typingRow.className = "msg-row in";
  typingRow.innerHTML = `<div class="msg-avatar ai"></div><div class="msg-col"><div class="msg-sender">MyAIha</div><div class="bubble typing"><span></span><span></span><span></span></div></div>`;
  msgEl.appendChild(typingRow);
  msgEl.scrollTop = msgEl.scrollHeight;

  setTimeout(() => {
    typingRow.remove();
    const reply = {from:"in", sender:"MyAIha", cls:"ai", text:"Got it — I've noted that and I'm checking the best next step for you.", time:"Now"};
    c.messages.push(reply);
    msgEl.appendChild(buildMsgRow(reply));
    msgEl.scrollTop = msgEl.scrollHeight;
    c.sub = "Just now";
    renderList();
  }, 1100);
}

document.getElementById("sendBtn").addEventListener("click", () => sendMessage());
document.getElementById("composerInput").addEventListener("keydown", (e) => {
  if(e.key==="Enter" && !e.shiftKey){ e.preventDefault(); sendMessage(); }
});
document.querySelectorAll(".qchip").forEach(chip => {
  chip.addEventListener("click", () => sendMessage(chip.dataset.q));
});

renderList();
renderThread();
</script>
</body>
</html>
